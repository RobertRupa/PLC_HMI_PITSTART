<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<style>
text{font-family:Arial,sans-serif;font-size:22px;fill:#111}.title{font-size:34px;font-weight:bold}.h{font-size:26px;font-weight:bold}.box{fill:#fff;stroke:#111;stroke-width:3}.line{stroke:#111;stroke-width:4;fill:none}.note{font-size:18px}
</style>
<text x="40" y="50" class="title">PLC_HMI_PITSTART — schemat połączeniowy</text>
<rect x="80" y="140" width="330" height="440" class="box"/>
<text x="185" y="185" class="h">RM5 Evolution</text>
<text x="110" y="245">pin 2  +12…24 V</text>
<text x="110" y="305">pin 1  GND</text>
<text x="110" y="365">pin 7  CH1</text>
<text x="110" y="425">pin 6  INHIBIT</text>
<rect x="550" y="140" width="420" height="440" class="box"/>
<text x="675" y="185" class="h">PLC SEEKU</text>
<text x="590" y="305">INPUT COM / 0 V</text>
<text x="590" y="365">X27 — RM5 pulse</text>
<text x="590" y="425">Y23 — INHIBIT relay</text>
<text x="590" y="485">Y1 — PITStart pulse</text>
<text x="590" y="545">COM Y1 / COM Y23</text>
<rect x="1090" y="340" width="250" height="180" class="box"/>
<text x="1140" y="385" class="h">PITStart</text>
<text x="1120" y="445">PULSE IN</text>
<text x="1120" y="490">COMMON</text>
<path d="M410 305 H550" class="line"/>
<path d="M410 365 H550" class="line"/>
<text x="430" y="288" class="note">GND / 0 V</text>
<text x="430" y="350" class="note">CH1 open collector</text>
<path d="M410 425 H520 V650 H1010 V425 H970" class="line"/>
<text x="455" y="452" class="note">INHIBIT</text>
<path d="M970 485 H1090" class="line"/>
<path d="M970 545 H1040 V490 H1090" class="line"/>
<path d="M250 245 V95 H1030 V650 H1010" class="line"/>
<text x="470" y="85" class="note">+24 VDC → RM5 pin 2 oraz COM grupy Y23</text>
<text x="80" y="650" class="h">Logika</text>
<text x="80" y="700">/M300 → Y23: brak INVERTER_OK blokuje RM5.</text>
<text x="80" y="745">X27 → paczka impulsów → D320; timeout T200 = 1 s.</text>
<text x="80" y="790">Y1: 100 ms ON + 100 ms OFF, dopóki D330 &gt; 0.</text>
</svg>